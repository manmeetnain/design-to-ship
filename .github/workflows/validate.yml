name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository
        run: python3 scripts/validate.py

      - name: Run contract tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v

      - name: Exercise CLI
        env:
          PYTHONPATH: src
        run: |
          python3 -m design_to_ship validate examples/focus-checkout.json
          python3 -m design_to_ship trace examples/focus-checkout.json
          python3 -m design_to_ship validate examples/beacon/project.json
          python3 -m design_to_ship library patterns checkout
          python3 -m design_to_ship export examples/beacon/project.json --output /tmp/beacon-contract.md
