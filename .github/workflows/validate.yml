name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository
        run: python3 scripts/validate.py

      - name: Check static prototype contract
        run: python3 scripts/check_prototype.py

      - name: Run contract tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v

      - name: Exercise CLI
        env:
          PYTHONPATH: src
        run: |
          python3 -m design_to_ship validate examples/focus-checkout.json
          python3 -m design_to_ship trace examples/focus-checkout.json
          python3 -m design_to_ship validate examples/beacon/project.json
          python3 -m design_to_ship library patterns checkout
          python3 -m design_to_ship export examples/beacon/project.json --output /tmp/beacon-contract.md

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install browser verification
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Beacon fixture
        run: python3 -m http.server 4173 --directory examples/beacon/prototype &

      - name: Run browser verification
        run: npm run test:browser

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beacon-browser-evidence
          path: artifacts/browser
          if-no-files-found: warn
