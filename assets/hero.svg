<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Design to Ship</title>
  <desc id="desc">The open workflow from product intent to production proof</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111D33"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <g fill="none" stroke="url(#line)" stroke-width="4" opacity=".9">
    <path d="M110 298h980"/>
    <circle cx="150" cy="298" r="12" fill="#A7F3D0"/>
    <circle cx="375" cy="298" r="12" fill="#8DEED5"/>
    <circle cx="600" cy="298" r="12" fill="#70E5DD"/>
    <circle cx="825" cy="298" r="12" fill="#53D8EA"/>
    <path d="m1060 278 30 20-30 20"/>
  </g>
  <g font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F8FAFC">
    <text x="100" y="128" font-size="68" font-weight="750" letter-spacing="-2">Design to Ship</text>
    <text x="102" y="178" font-size="25" fill="#CBD5E1">From product intent to production proof.</text>
    <g font-size="18" font-weight="650" text-anchor="middle">
      <text x="150" y="345">INTENT</text>
      <text x="375" y="345">STRUCTURE</text>
      <text x="600" y="345">SYSTEM</text>
      <text x="825" y="345">BUILD</text>
