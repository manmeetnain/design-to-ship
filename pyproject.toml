[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "design-to-ship"
version = "0.5.0"
description = "Evidence-driven product design workflow from requirements to verified implementation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manmeet Nain" }]
keywords = ["product-design", "agent-skills", "ui-ux", "design-systems", "accessibility"]

[project.scripts]
design-to-ship = "design_to_ship.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
